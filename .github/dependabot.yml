version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    groups:
      primevue: { patterns: ["primevue", "@primevue/*", "@primeuix/*"] }
      vue: { patterns: ["vue", "vue-router", "@vue/*", "@vitejs/*", "vite"] }
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
